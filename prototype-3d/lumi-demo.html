<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumi 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Caveat:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-sized 3D stage on a warm studio backdrop, after the Lumi sheet: serif name, handwritten notes, quiet beige. */
:root {
  --bg: #EDE6DE; --surface: #FAF7F3; --ink: #4B403A; --ink-2: #7D706A; --line: #DDD3C9;
  --accent: #C79A8F; --accent-ink: #FFFFFF; --accent-soft: #F3E3DF; --gold: #B88F55;
  --scene-sky: #EEE7DF; --scene-ground: #E6DDD2; --glass: rgba(250, 247, 243, .9); --shadow: rgba(75, 64, 58, .14);
  --display: "Playfair Display", "Noto Serif TC", Georgia, serif;
  --script: "Caveat", "Segoe Print", cursive;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1A18; --surface: #2B2421; --ink: #F2E9E2; --ink-2: #BFB1A8; --line: #3A312D;
    --accent: #E2B3A7; --accent-ink: #2B1D19; --accent-soft: #3B2C28; --gold: #D9B47A;
    --scene-sky: #2A2320; --scene-ground: #332B27; --glass: rgba(43, 36, 33, .9); --shadow: rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1A18; --surface: #2B2421; --ink: #F2E9E2; --ink-2: #BFB1A8; --line: #3A312D;
  --accent: #E2B3A7; --accent-ink: #2B1D19; --accent-soft: #3B2C28; --gold: #D9B47A;
  --scene-sky: #2A2320; --scene-ground: #332B27; --glass: rgba(43, 36, 33, .9); --shadow: rgba(0, 0, 0, .4);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body);
  display: flex; align-items: center; justify-content: center; gap: 56px;
  padding-inline: 16px; padding-block: 16px; box-sizing: border-box; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app {
  position: relative; flex: 0 0 auto; width: min(100%, 420px); height: min(100%, 880px);
  border-radius: 28px; overflow: hidden; background: var(--scene-sky);
  box-shadow: 0 0 0 1px var(--line), 0 24px 60px var(--shadow);
  user-select: none; -webkit-user-select: none;
}
#stage, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.bar { position: absolute; top: 0; left: 0; right: 0; padding: 16px 16px 0; display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.bar > * { pointer-events: auto; }
.brand b { display: flex; align-items: baseline; gap: 6px; font: 500 34px/1 var(--display); letter-spacing: .01em; }
.brand b span { font-size: 20px; color: var(--accent); }
.brand small { display: block; margin-top: 4px; color: var(--ink-2); font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; }
.tools { display: flex; gap: 6px; }
.round { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--glass); box-shadow: 0 2px 10px var(--shadow); font-size: 15px; display: grid; place-items: center; }
.round[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.mood {
  position: absolute; top: 92px; left: 16px; padding: 2px 14px 4px; border-radius: 999px; background: var(--glass);
  box-shadow: 0 2px 10px var(--shadow); font: 500 22px/1.3 var(--script); color: var(--ink); transition: opacity .25s;
}
.bubble {
  position: absolute; left: 0; top: 0; padding: 6px 13px; border-radius: 16px; background: var(--surface); box-shadow: 0 6px 18px var(--shadow);
  font: 500 15px/1.3 var(--body); white-space: nowrap; transform: translate(-50%, -100%); pointer-events: none;
}

.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px 12px; display: grid; gap: 8px; pointer-events: none; }
.dock > * { pointer-events: auto; }
.dock-row { display: flex; align-items: flex-end; gap: 10px; }
#joy { position: relative; flex: 0 0 auto; width: 96px; height: 96px; border-radius: 50%; background: var(--glass); box-shadow: 0 2px 12px var(--shadow); touch-action: none; }
#joy::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 1.5px dashed var(--line); }
#knob { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: var(--accent); box-shadow: 0 3px 8px var(--shadow); }
.actions { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.act {
  display: grid; justify-items: center; gap: 1px; padding: 9px 4px 8px; border-radius: 16px; border: 0;
  background: var(--glass); box-shadow: 0 2px 10px var(--shadow); font-weight: 500; font-size: 13.5px;
}
.act small { font: 500 15px/1 var(--script); color: var(--ink-2); }
.act[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.act[aria-pressed="true"] small { color: var(--accent-ink); }
.hint { margin: 0; text-align: center; color: var(--ink-2); font-size: 11.5px; text-shadow: 0 1px 0 var(--scene-sky); }

#loading, #error { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 4px; background: var(--scene-sky); }
#loading b { font: 500 26px/1.3 var(--display); }
#loading p, #error p { margin: 0; color: var(--ink-2); }

.about { flex: 0 1 300px; min-width: 0; display: grid; gap: 14px; }
.about .script { margin: 0; font: 500 30px/1.05 var(--script); color: var(--ink); transform: rotate(-4deg); transform-origin: left; }
.about h1 { margin: 0; display: flex; align-items: baseline; gap: 10px; font: 500 64px/1 var(--display); }
.about h1 span { font-size: 34px; color: var(--accent); }
.about .tag { margin: -6px 0 0; color: var(--ink-2); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; }
.about p { margin: 0; color: var(--ink-2); max-width: 34ch; }
.values { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 280px; margin-top: 4px; }
.values div { display: grid; justify-items: center; gap: 4px; font-size: 10px; letter-spacing: .14em; color: var(--ink-2); }
.values svg { width: 24px; height: 24px; fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 820px) { .about { display: none; } }
@media (max-width: 480px) {
  body { padding: 0; }
  #app { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
}
@media (prefers-reduced-motion: reduce) { .mood { transition: none; } }
</style>
</head>
<body>
<main id="app">
  <div id="stage" aria-label="可旋轉的 3D 場景：Lumi 和貓咪"></div>
  <header class="bar">
    <div class="brand"><b>Lumi <span aria-hidden="true">♡</span></b><small>A brighter you, everyday</small></div>
    <div class="tools">
      <button id="spin" class="round" aria-pressed="false" aria-label="鏡頭自動繞一圈">⟳</button>
      <button id="recenter" class="round" aria-label="鏡頭回到預設位置">⌖</button>
    </div>
  </header>
  <div id="mood" class="mood">Hello!</div>
  <div id="bubble" class="bubble" hidden></div>
  <div class="dock">
    <div class="dock-row">
      <div id="joy" role="group" aria-label="移動搖桿"><div id="knob"></div></div>
      <div class="actions">
        <button class="act" data-pose="wave" aria-pressed="false">揮手<small>Hello</small></button>
        <button class="act" data-pose="wink" aria-pressed="false">眨眼<small>Playful</small></button>
        <button class="act" data-pose="hug" aria-pressed="false">抱貓咪<small>Warm</small></button>
      </div>
    </div>
    <p class="hint">拖曳畫面轉鏡頭・雙指或滾輪縮放・點地面讓 Lumi 走過去</p>
  </div>
  <div id="loading"><b>Lumi</b><p>正在整理頭髮…</p></div>
  <div id="error" hidden role="alert"><b>3D 場景無法啟動</b><p>請換用支援 WebGL 的瀏覽器，或開啟硬體加速後重新整理。</p></div>
</main>
<aside class="about">
  <p class="script">A brighter day<br>together ♡</p>
  <h1>Lumi <span aria-hidden="true">♡</span></h1>
  <p class="tag">A brighter you, everyday</p>
  <p>依角色設定圖用程式碼建出的原創 3D 角色：會眨眼、會走路，長髮會跟著擺動。三個按鈕是設定圖上的三個動作，貓咪 Mochi 會一直跟在旁邊。</p>
  <div class="values" aria-label="Lumi 的四個關鍵字">
    <div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>KIND</div>
    <div><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>POSITIVE</div>
    <div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18C6 10 11 5 19 5c0 8-5 13-13 13zM6 18l7-7"/></svg>GROW</div>
    <div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 2.3 4.8 5.2.7-3.8 3.6.9 5.2L12 15.9l-4.6 2.4.9-5.2-3.8-3.6 5.2-.7z"/></svg>TOGETHER</div>
  </div>
</aside>
<script src="vendor/three.min.js"></script>
<script src="cat-kit.js"></script>
<script src="lumi-kit.js"></script>
<script src="lumi-demo.js"></script>
</body>
</html>
