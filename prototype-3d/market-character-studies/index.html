<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>市場戲精俱樂部 · 角色試裝間</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0e9df;color:#3d342d;font-family:system-ui,"Microsoft JhengHei",sans-serif}header{padding:22px 30px;border-bottom:1px solid #d8cfc3;display:flex;align-items:center;justify-content:space-between;gap:16px}header small{font-size:11px;letter-spacing:.2em;color:#927a64}h1{margin:5px 0;font-size:26px}header p{margin:0;color:#887969;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:calc(100dvh - 104px)}#stage{position:relative;min-height:620px;touch-action:none}canvas{display:block;width:100%;height:100%}.hint{position:absolute;bottom:18px;left:22px;color:#8a7a69;font-size:12px}#status{position:absolute;top:22px;left:22px;color:#8a7a69}aside{background:#fffaf3;padding:25px;border-left:1px solid #d8cfc3}h2{margin:0;font-size:28px}blockquote{margin:12px 0 20px;font-size:17px;font-weight:600;color:#895a43;line-height:1.7}#cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{font:inherit;cursor:pointer;border:1px solid #d9ccbc;background:#fffdf8;color:#544537;border-radius:12px}#cards button{overflow:hidden;padding:0 0 10px;font-size:13px;text-align:center;transition:background .15s}#cards button[aria-pressed=true]{border:2px solid #a46848;background:#f3e3d4}#cards img{width:100%;height:115px;object-fit:cover;object-position:50% 38%;display:block;mix-blend-mode:multiply}#cards b{display:block;padding-top:6px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.actions button{padding:9px 12px;font-size:12px}.actions button[aria-pressed=true]{background:#e8d4be}footer{margin-top:20px;color:#9b8b79;font-size:11px;line-height:1.8}a{color:#8f6046}#download{font-size:13px}@media(max-width:800px){header{padding:18px 20px}header p{display:none}main{grid-template-columns:1fr}#stage{height:62dvh;min-height:400px}aside{border-left:0;padding:22px}#cards{grid-template-columns:repeat(4,1fr)}#cards img{height:105px}h1{font-size:23px}}@media(max-width:440px){#cards{gap:7px}#cards img{height:90px}#cards button{font-size:11px}}
</style></head>
<body><header><div><small>MARKET PEOPLE / CHARACTER STUDIES</small><h1>市場戲精俱樂部</h1></div><p>熟悉的市場人物，各有各的戲。</p></header>
<main><section id="stage" aria-label="角色立體展示"><span id="status">準備出場…</span><span class="hint">拖曳旋轉 · 滾輪縮放 · 雙指縮放</span></section><aside><h2 id="name">買菜阿嬤</h2><blockquote id="quote"></blockquote><div class="actions"><button id="front">正面</button><button id="back">背面</button><button id="spin" aria-pressed="false">自動旋轉</button><button id="reset">重設</button></div><nav id="cards" aria-label="選擇角色"></nav><footer>第一輪造型預覽，點人物卡片換角色。<br>喜歡的版本再放進菜市漫遊。</footer><p><a id="download" download>下載目前角色</a></p></aside></main>
<script src="../vendor/three.min.js"></script><script src="../vendor/GLTFLoader.js"></script>
<script>
const cast=[
 {id:'grandma',name:'買菜阿嬤',quote:'「這把蔥順便送我啦。」'},
 {id:'chief',name:'里長伯',quote:'「來來來！大家聽我講一下！」'},
 {id:'grandpa',name:'散步阿公',quote:'「我只是經過，順便聊兩個鐘頭。」'},
 {id:'dama',name:'殺價大媽',quote:'「這個價格，你認真？」',model:'../dama-character/dama-character.glb',image:'../dama-character/dama_three_quarter.png'},
 {id:'uncle',name:'汗衫阿伯',quote:'「天氣有夠熱，先喝一口茶。」'},
 {id:'housewife',name:'家庭主婦',quote:'「誰又把地板踩髒？」'},
 {id:'kid',name:'幼稚園小朋友',quote:'「那個西瓜比我的頭還大欸！」'},
 {id:'taike',name:'八酒',quote:'「老闆，飲料冰一點。」',model:'../bajiu/bajiu.glb',image:'../bajiu/preview.png'}
];
const stage=document.querySelector('#stage'),scene=new THREE.Scene();scene.background=new THREE.Color('#f0e9df');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;stage.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(33,1,.1,50);scene.add(new THREE.HemisphereLight(0xfff7e8,0x767d83,1.7));const key=new THREE.DirectionalLight(0xfff3de,2.7);key.position.set(-3,5,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-2;key.shadow.camera.right=2;key.shadow.camera.top=4;key.shadow.camera.bottom=-1;key.shadow.bias=-.0004;scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,1.2);fill.position.set(3,3,-3);scene.add(fill);
const disk=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.06,.10,80),new THREE.MeshStandardMaterial({color:'#e9dcc8',roughness:.9}));disk.position.y=-.05;disk.receiveShadow=true;scene.add(disk);
const group=new THREE.Group();scene.add(group);const cache=new Map(),loader=new THREE.GLTFLoader();let request=0,current=null;
let yaw=.26,pitch=.10,radius=5.5,auto=false;const pointers=new Map();let pinch=0;
function load(url){if(cache.has(url))return cache.get(url);const promise=new Promise((res,rej)=>loader.load(url,g=>res(g.scene),undefined,rej));cache.set(url,promise);return promise}
async function choose(c){const token=++request;const status=document.querySelector('#status');status.hidden=false;status.textContent='準備出場…';document.querySelector('#name').textContent=c.name;document.querySelector('#quote').textContent=c.quote;document.querySelectorAll('[data-id]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===c.id)));const url=c.model||c.id+'.glb';document.querySelector('#download').href=url;
 try{const source=await load(url);if(token!==request)return;if(current)group.remove(current);current=source;if(c.id==='taike'){const originalSize=new THREE.Box3().setFromObject(current).getSize(new THREE.Vector3());current.scale.multiplyScalar(2.4/originalSize.y);}const bounds=new THREE.Box3().setFromObject(current),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());current.position.x-=center.x;current.position.z-=center.z;current.position.y-=bounds.min.y;current.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});group.add(current);yaw=.26;pitch=.10;radius=Math.max(5.0,size.y*2.25);status.hidden=true;}catch(e){if(token===request)status.textContent='角色暫時無法載入，請重新整理。'} }
cast.forEach(c=>{const b=document.createElement('button');b.dataset.id=c.id;b.setAttribute('aria-pressed','false');const img=document.createElement('img');img.src=c.image||c.id+'.png';img.alt='';const label=document.createElement('b');label.textContent=c.name;b.append(img,label);b.onclick=()=>choose(c);document.querySelector('#cards').append(b)});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
function stop(){auto=false;document.querySelector('#spin').setAttribute('aria-pressed','false')}
document.querySelector('#front').onclick=()=>{yaw=0;pitch=.03;stop()};document.querySelector('#back').onclick=()=>{yaw=Math.PI;pitch=.04;stop()};document.querySelector('#reset').onclick=()=>{yaw=.26;pitch=.10;radius=5.5;stop()};document.querySelector('#spin').onclick=()=>{auto=!auto;document.querySelector('#spin').setAttribute('aria-pressed',String(auto))};
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});stop();pinch=0});stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)radius=Math.max(2.6,Math.min(9,radius*pinch/d));pinch=d}else{yaw-=(e.clientX-old.x)*.008;pitch=Math.max(-.3,Math.min(.65,pitch+(e.clientY-old.y)*.005))}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(ev,e=>{pointers.delete(e.pointerId);pinch=0});stage.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(2.6,Math.min(9,radius+e.deltaY*.007))},{passive:false});
let last=performance.now();function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(auto)yaw+=dt*.45;camera.position.set(radius*Math.sin(yaw)*Math.cos(pitch),1.22+radius*Math.sin(pitch),radius*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(0,1.22,0);renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);choose(cast[0]);
</script></body></html>
