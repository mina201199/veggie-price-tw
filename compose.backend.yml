name: caijia-backend
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/backend.env}
    volumes:
      - ledger_db:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/ledger
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${BACKEND_DOMAIN:?Set BACKEND_DOMAIN},localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${BACKEND_DOMAIN}
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_COOKIES: "1"
      DJANGO_PROXY_SSL_HEADER: "1"
      BACKEND_DATA_DIR: /app/private/backend
      WAITRESS_TRUSTED_PROXY: ${CADDY_INTERNAL_IP:-172.30.88.10}
    volumes:
      - ledger_media:/app/private/backend
    networks:
      frontend:
        ipv4_address: ${APP_INTERNAL_IP:-172.30.88.20}
      database: {}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8878/api/v1/health/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?Set BACKEND_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      frontend:
        ipv4_address: ${CADDY_INTERNAL_IP:-172.30.88.10}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  ledger_db:
  ledger_media:
  caddy_data:
  caddy_config:



networks:
  frontend:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.88.0/24}
  database:
    internal: true
